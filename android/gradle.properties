org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=false
# AGP 9 provides Kotlin support without the legacy Kotlin Gradle Plugin.
android.builtInKotlin=true
# Flutter currently requires the legacy Android DSL when used with AGP 9.
android.newDsl=false
# Remove after Flutter stable includes flutter/flutter#192206. Flutter 3.47.5
# incorrectly validates AGP's bundled Kotlin as a standalone Kotlin plugin.
skipDependencyChecks=true
# Kotlin incremental caches cannot relativize plugin sources on C: to this D:
# checkout. Disable them so Windows cross-drive builds do not fail and retry.
kotlin.incremental=false
